<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="1200" height="780" fill="#FFFFFF"/>

  <text x="60" y="62" font-size="40" font-weight="700" fill="#1F2328">一张图看懂 XContext</text>
  <text x="60" y="98" font-size="18" fill="#6B7280">一条用户消息进来之后，到 prompt 拼好送进大模型，中间发生了什么</text>

  <!-- [1] material pool -->
  <rect x="60" y="150" width="190" height="220" rx="16" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="60" cy="150" r="16" fill="#1F2328"/>
  <text x="60" y="156" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="80" y="192" font-size="19" font-weight="700" fill="#1F2328">素材池</text>
  <text x="80" y="214" font-size="13" fill="#9CA3AF">所有存下来的上下文</text>
  <g font-size="15" fill="#4B5563">
    <circle cx="86" cy="242" r="4" fill="#CCFBF1"/>
    <circle cx="86" cy="242" r="2.5" fill="#0D9488"/>
    <text x="100" y="247">对话历史</text>
    <circle cx="86" cy="272" r="4" fill="#DBEAFE"/>
    <circle cx="86" cy="272" r="2.5" fill="#3E63DD"/>
    <text x="100" y="277">用户画像</text>
    <circle cx="86" cy="302" r="4" fill="#FEE4E2"/>
    <circle cx="86" cy="302" r="2.5" fill="#E5484D"/>
    <text x="100" y="307">约束规则</text>
    <circle cx="86" cy="332" r="4" fill="#EDE9FE"/>
    <circle cx="86" cy="332" r="2.5" fill="#8B5CF6"/>
    <text x="100" y="337">历史摘要</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="2.5" fill="#9CA3AF">
    <line x1="252" y1="260" x2="282" y2="260"/>
    <polygon points="290,260 278,254 278,266"/>
  </g>

  <!-- [2] actions -->
  <rect x="292" y="150" width="230" height="220" rx="16" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="292" cy="150" r="16" fill="#1F2328"/>
  <text x="292" y="156" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="312" y="192" font-size="19" font-weight="700" fill="#1F2328">七个角色并行取材</text>
  <text x="312" y="214" font-size="13" fill="#9CA3AF">每个只回答一个问题</text>
  <g font-size="13" text-anchor="middle">
    <rect x="306" y="230" width="96" height="28" rx="8" fill="#FEE4E2" stroke="#E5484D"/>
    <text x="354" y="249" fill="#B42318">约束</text>
    <rect x="410" y="230" width="96" height="28" rx="8" fill="#FFFAEB" stroke="#F59E0B"/>
    <text x="458" y="249" fill="#92400E">关键事实</text>
    <rect x="306" y="264" width="96" height="28" rx="8" fill="#DBEAFE" stroke="#3E63DD"/>
    <text x="354" y="283" fill="#1E40AF">用户画像</text>
    <rect x="410" y="264" width="96" height="28" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
    <text x="458" y="283" fill="#065F46">对话历史</text>
    <rect x="306" y="298" width="96" height="28" rx="8" fill="#EDE9FE" stroke="#8B5CF6"/>
    <text x="354" y="317" fill="#5B21B6">摘要</text>
    <rect x="410" y="298" width="96" height="28" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="458" y="317" fill="#4B5563">召回细节</text>
    <rect x="306" y="332" width="200" height="28" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="406" y="351" fill="#075985">任务状态</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="2.5" fill="#9CA3AF">
    <line x1="524" y1="260" x2="554" y2="260"/>
    <polygon points="562,260 550,254 550,266"/>
  </g>

  <!-- [3] orchestrator -->
  <rect x="564" y="150" width="250" height="220" rx="16" fill="#EEF2FF" stroke="#3E63DD" stroke-width="2.5"/>
  <circle cx="564" cy="150" r="16" fill="#3E63DD"/>
  <text x="564" y="156" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="584" y="192" font-size="19" font-weight="700" fill="#1E3A8A">策略编排器</text>
  <text x="584" y="214" font-size="13" fill="#3E63DD">整套系统真正干活的地方</text>
  <g font-size="15" fill="#1E3A8A">
    <text x="584" y="250">· 按优先级从高到低装填</text>
    <text x="584" y="280">· 预算不够，先按级压缩</text>
    <text x="584" y="310">· 再不够，整段丢弃</text>
    <text x="584" y="340">· 每一步都留执行指标</text>
  </g>

  <g stroke="#9CA3AF" stroke-width="2.5" fill="#9CA3AF">
    <line x1="816" y1="260" x2="846" y2="260"/>
    <polygon points="854,260 842,254 842,266"/>
  </g>

  <!-- [4] window -->
  <rect x="856" y="150" width="180" height="220" rx="16" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="856" cy="150" r="16" fill="#1F2328"/>
  <text x="856" y="156" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="876" y="192" font-size="19" font-weight="700" fill="#1F2328">上下文窗口</text>
  <text x="876" y="214" font-size="13" fill="#9CA3AF">稳定前缀 + 易变尾巴</text>
  <rect x="876" y="232" width="140" height="64" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="946" y="260" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">稳定前缀</text>
  <text x="946" y="280" font-size="12" fill="#065F46" text-anchor="middle">约束 / 画像 / 事实</text>
  <rect x="876" y="304" width="140" height="48" rx="8" fill="#FFFAEB" stroke="#F59E0B"/>
  <text x="946" y="324" font-size="14" font-weight="600" fill="#92400E" text-anchor="middle">易变尾巴</text>
  <text x="946" y="342" font-size="12" fill="#92400E" text-anchor="middle">本轮对话 / 工具结果</text>

  <g stroke="#1F2328" stroke-width="2.5" fill="#1F2328">
    <line x1="1038" y1="260" x2="1062" y2="260"/>
    <polygon points="1070,260 1058,254 1058,266"/>
  </g>

  <!-- LLM -->
  <rect x="1078" y="150" width="62" height="220" rx="14" fill="#1F2328"/>
  <g font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="1109" y="236">大</text>
    <text x="1109" y="264">模</text>
    <text x="1109" y="292">型</text>
  </g>
  <text x="1109" y="330" font-size="12" fill="#9CA3AF" text-anchor="middle">回答</text>

  <text x="200" y="410" font-size="16" fill="#4B5563">同步链路就这四步。<tspan font-weight="700" fill="#1F2328">每一环都是独立角色，可以单独替换、单独测试</tspan>，换检索后端不用动编排逻辑</text>

  <line x1="60" y1="440" x2="1140" y2="440" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- async loop -->
  <text x="60" y="480" font-size="19" font-weight="700" fill="#1F2328">回复结束之后，后台还在干活（end_of_turn）</text>

  <g font-size="14" text-anchor="middle">
    <rect x="60" y="504" width="240" height="64" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="180" y="532" fill="#1F2328">Agent 回复完这一轮</text>
    <rect x="360" y="504" width="220" height="64" rx="10" fill="#FFFAEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="470" y="532" fill="#92400E">立刻触发 end_of_turn</text>
    <rect x="640" y="504" width="250" height="64" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="765" y="532" fill="#5B21B6">摘要提取 + 画像更新</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="2" fill="#9CA3AF">
    <line x1="302" y1="536" x2="350" y2="536"/>
    <polygon points="358,536 346,530 346,542"/>
    <line x1="582" y1="536" x2="630" y2="536"/>
    <polygon points="638,536 626,530 626,542"/>
  </g>

  <path d="M765 568 V 620 H 40 V 340 H 50" stroke="#0D9488" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
  <polygon points="58,340 46,334 46,346" fill="#0D9488"/>
  <rect x="330" y="600" width="300" height="38" rx="10" fill="#F0FDFA" stroke="#0D9488"/>
  <text x="480" y="625" font-size="15" font-weight="600" fill="#065F46" text-anchor="middle">写回素材池，下一轮直接用</text>

  <text x="60" y="690" font-size="16" fill="#4B5563">后台跑什么用户无感。<tspan font-weight="700" fill="#1F2328">但用户下次开口时，Agent 已经「想好了」</tspan></text>
  <text x="60" y="720" font-size="15" fill="#B42318">反过来，如果你在用户开口那一刻才开始算，用户就是在等你算</text>
  <text x="60" y="752" font-size="15" fill="#9CA3AF">配套的还有 K-turn 原始窗口，最近 K 轮一定留原文，摘要没算完也不怕</text>
</svg>
